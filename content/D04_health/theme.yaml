theme_id: D04_health
title_zh: "流感疫苗接种与健康防护"
title_en: "Flu Vaccination and Health Protection"

# ---------- 语言版本（v1.4 规则）----------
language: zh-only          # bilingual（受众含 A06 国际居民）| zh-only（仅中文）
language_rule: "受众含 A06 → 出中英双语；否则只出中文海报与相关内容"

# ---------- 风格来源（v1.6：先按五大类，15 类暂不细分）----------
family: F2                    # 健康与照护
style_ref: references/05-style-spec.md#F2
style_status: 待填（人类补全五大类风格要求表后自动生效；本类继承 F2，不单独改）

# ---------- 五轴 ----------
domain: D04
function: S1
audience: [A02, A04, A01]
audience_status: "AI 按主题拟定，待用户确认"   # 用户给出受众时以用户为准
timeliness: T2
authority: L2
skeleton: S1

# ---------- 画布：默认固定 A3（用户指定尺寸时才改，见 04_SKILL.md 尺寸决策规则）----------
canvas:
  size_mm: [297, 420]            # 默认 A3 竖版（裁切线内）；用户指定其他尺寸时以其为准
  ratio: "1:1.414"
  bleed_mm: 3
  total_mm: [303, 426]
  px_300dpi: [3508, 4961]        # 成品
  px_300dpi_bleed: [3579, 5032]  # 含出血
  format: [PNG, PDF]             # PNG 供屏幕/微信，PDF 供打印店
  color: sRGB
  transparent: false
  safe_margin_mm: 18
  body_font_min_pt: 26           # 含老年人/残障受众 → 31
  crop_marks: true
  design_units: [1080, 1527]     # 等比基准；每行容量 中文 25 字 / 英文 49 字符

# ---------- 母本 ----------
items: 11
org: {zh: "社区健康与服务中心", en: "Community Health and Service Center"}
placeholders:                    # 全部为示例值，发布前必须替换
  ORG_ZH: "社区健康与服务中心"
  ORG_EN: "Community Health and Service Center"
  TITLE_ZH: "流感疫苗接种与健康防护"
  TITLE_EN: "Flu Vaccination and Health Protection"
  SITES_ZH: "社区卫生服务站、东门驿站临时接种点"
  SITES_EN: "Community Health Station; East Gate Station (temporary)"
  HOURS_ZH: "每周一至周六 9:00-16:00"
  HOURS_EN: "Mon-Sat 9:00-16:00"
  PHONE: "400-123-2026"

# ---------- L2 通用常识的来源（Gate 2 逐条复核）----------
sources:
  - item: "接种后留观 30 分钟"
    basis: "国家卫生健康委 / 中国疾控中心 预防接种科普口径"
    level: L2
  - item: "优先接种人群"
    basis: "国家卫生健康委 流感疫苗接种建议"
    level: L2
  - item: "接种前如实告知健康状况"
    basis: "预防接种工作规范（禁忌判定由医护人员负责）"
    level: L2
  - item: "勤洗手、常通风、咳嗽遮掩口鼻"
    basis: "中国疾控中心 呼吸道传染病健康科普"
    level: L2

# ---------- 待人类确认（未填齐不得出图）----------
needs_human:
  - "接种点本季是否真实开放"
  - "开放时间是否含节假日"
  - "咨询电话是否可对外公开"
  - "疫苗种类与费用口径（严禁自行写“免费”）"
  - "发布日期与有效期（T2 必填下次日期）"

# ---------- 骨架与分类专属校验 ----------
checks:
  - "S1：时间与地点为画面最高优先级"
  - "受众含 A02 → 正文 ≥40px、对比度 ≥7:1"
  - "不替医护做医学判断；“发热”限定为“持续发热”"
  - "不得出现诊断 / 治疗建议与效果承诺"
  - "行数对齐：英文行数 ≤ 中文行数 + 1 且 ≤ 3 行（references/03-line-parity.md）"
  - "母本 11 项字符级 100% 命中；电话两版字符一致"

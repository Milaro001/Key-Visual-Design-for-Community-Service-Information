timeliness: T1
authority: L3
skeleton: S1

# ---------- 画布：默认固定 A3（用户指定尺寸时才改，见 04_SKILL.md 尺寸决策规则）----------
canvas:
  size_mm: [297, 420]            # 默认 A3 竖版（裁切线内）；用户指定其他尺寸时以其为准
  ratio: "1:1.414"
  bleed_mm: 3
  total_mm: [303, 426]
  px_300dpi: [3508, 4961]        # 成品
  px_300dpi_bleed: [3579, 5032]  # 含出血
  format: [PNG, PDF]             # PNG 供屏幕/微信，PDF 供打印店
  color: sRGB
  transparent: false
  safe_margin_mm: 18
  body_font_min_pt: 26           # 含老年人/残障受众 → 31
  crop_marks: true
  design_units: [1080, 1527]     # 等比基准；每行容量 中文 25 字 / 英文 49 字符

# ---------- 母本 ----------
items: 10
org: {zh: "社区为老服务中心", en: "Community Senior Service Center"}
placeholders:                    # 全部为示例值，发布前必须替换
  ORG_ZH: "社区为老服务中心"
  ORG_EN: "Community Senior Service Center"
  TITLE_ZH: "助餐服务与探访关爱"
  TITLE_EN: "Meal Service and Home Visits"
  SITES_ZH: "社区服务中心一层助餐点"
  SITES_EN: "Meal point, ground floor, Community Service Center"
  HOURS_ZH: "每日 11:00-12:30"
  HOURS_EN: "daily 11:00-12:30"
  PHONE: "400-123-2023"

